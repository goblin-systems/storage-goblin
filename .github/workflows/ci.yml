name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (with coverage)
        run: bun run test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        run: bun run test:rust

      # The `tauri-command-tests` feature had never been compiled (it carried
      # duplicate imports and a missing one) so its command-level integration
      # tests were dead. They are fixed and wired here, but the Tauri mock
      # runtime fails to load on the Windows dev machine, so this has not been
      # observed green yet — non-blocking until one CI run proves it out, then
      # fold it into the step above. See backlog/phase-1-sync-correctness.md.
      - name: Rust command integration tests (unproven — see comment)
        continue-on-error: true
        run: bun run test:rust:commands

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: bun run tauri build --ci --no-sign --no-bundle

  rust-coverage:
    name: Rust coverage (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --summary-only --output-path rust-coverage.txt && cat rust-coverage.txt

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust-coverage.txt
          retention-days: 14
