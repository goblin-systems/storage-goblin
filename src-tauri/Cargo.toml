[package]
name = "storage-goblin"
version = "0.2.0"
description = "Desktop S3 sync scaffold powered by Tauri"
authors = ["Sergej Popov"]
edition = "2021"

[lib]
name = "storage_goblin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
tauri-command-tests = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
jsonwebtoken = "9"
keyring = { version = "3.6", features = ["windows-native"] }
notify = "6"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
trash = "5.2.6"
